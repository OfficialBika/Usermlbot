name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usermlbot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-runtime-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python source
        run: python -m compileall -q main.py tests

      - name: Run regression contracts
        run: python -m unittest discover -s tests -p 'test_source_contracts.py' -v
  runtime-import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime import dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyrofork==2.3.69 TgCrypto-pyrofork==1.2.8 python-dotenv motor numpy opencv-python-headless pytesseract Pillow ImageHash

      - name: Import application module
        run: |
          python -c 'import main; print("Usermlbot module import: OK")'

      - name: Run runtime behavior tests
        run: python -m unittest discover -s tests -v
